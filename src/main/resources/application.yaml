server:
  port: 8088
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tinder_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5432/tinder_db
    user: postgres
    password: postgres
    locations: classpath:db/migration
    baseline-on-migrate: true
jwt:
  secret: SecretKeyForJWTGeneration12345678
  expiration: 36000000
